name: Good First Issue
description: Suggest a beginner-friendly contribution
title: "[Good First Issue]: "

body:
  - type: markdown
    attributes:
      value: |
        Use this template to suggest a beginner-friendly contribution.

  - type: textarea
    id: task_description
    attributes:
      label: Task Description
      description: Describe the task in detail.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Documentation
        - HTML
        - CSS
        - JavaScript
        - Accessibility
        - UI/UX
        - Testing
        - Refactoring
        - Other
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Beginner
        - Beginner+
        - Intermediate
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be completed for this issue to be considered done?
      placeholder: |
        - Feature works correctly
        - No console errors
        - Documentation updated if necessary
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Maintainer Checklist
      options:
        - label: This task is suitable for first-time contributors.
          required: true
        - label: The scope is small and well-defined.
          required: true
