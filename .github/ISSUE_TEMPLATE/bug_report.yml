name: Bug Report
description: Report something that isn't working as expected
title: "[Bug]: "

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clearly describe the issue.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to...
        2. Click on...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add screenshots, error messages, or logs if available.

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome, Firefox, Edge, Safari

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11, Ubuntu 24.04, macOS

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before creating this report.
          required: true
        - label: I can reproduce this issue consistently.
        - label: I am using the latest version of the project.
